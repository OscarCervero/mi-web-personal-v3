<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buscador interno del sitio web personal de Óscar Cervero Luiña.">
  <title>Buscar | Mi Sitio Web</title>
  <link rel="stylesheet" href="css/base.css">
  <script src="js/layout.js" defer></script>
  <script src="js/buscador.js" defer></script>
  <script src="js/i18n.js" defer></script>
</head>
<body>
  <header></header>

  <main>
    <h1>Buscador del sitio</h1>

    <section>
      <h2>Buscar contenidos</h2>
      <p>Introduce palabras clave sobre mi formación, proyectos, aficiones o datos de contacto:</p>

      <search>
        <form action="buscar.html" method="get" aria-label="Buscador interno de la página">
          <span>Término de búsqueda:</span>
          <input type="search" name="q" title="Término de búsqueda" aria-label="Término de búsqueda" placeholder="Ej.: Angular, Péndulo, Tarantino, Babel..." required>
          <button type="submit">Buscar</button>
        </form>
      </search>

      <output role="status" aria-live="polite"></output>
    </section>

    <section aria-label="Resultados de la búsqueda">
      <h2>Resultados</h2>
      <p>Introduce un término en el cuadro superior para iniciar la búsqueda.</p>
    </section>
  </main>

  <footer></footer>
</body>
</html>
